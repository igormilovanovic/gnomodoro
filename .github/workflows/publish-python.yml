name: Publish Python Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build package
      run: python -m build
      
    - name: Check distribution
      run: twine check dist/*
      
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
      
    - name: Extract release notes from tag
      id: release_notes
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        VERSION=${TAG_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        
        # Extract release notes from CHANGELOG.md if available
        if [ -f CHANGELOG.md ]; then
          # Try to extract the section for this version
          NOTES=$(awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '1d;$d' | sed '/^$/d')
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG_NAME"
          fi
        else
          NOTES="Release $TAG_NAME"
        fi
        
        # Save to file to preserve multiline content
        echo "$NOTES" > /tmp/release_notes.txt
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Gnomodoro ${{ steps.release_notes.outputs.tag_name }}
        body_path: /tmp/release_notes.txt
        files: |
          dist/*.tar.gz
          dist/*.whl
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
